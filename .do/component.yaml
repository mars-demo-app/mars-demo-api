# App Platform fragment owned by mars-demo-api.
# Composed into the parent mars-demo-app spec by scripts/compose-app-spec.mjs.
services:
  - name: api
    github:
      repo: mars-demo-app/mars-demo-api
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # Demo toggle for MARS scenario 2a (crash-after-usage). "0" = healthy.
      - key: DEMO_CRASH_AFTER_REQUESTS
        scope: RUN_TIME
        value: "0"
      # Scale demo knobs — keep at 0 for normal browsing; raise in App Platform
      # console for traffic→scale (see repo-setup-status playbook C).
      - key: DEMO_HANDLER_DELAY_MS
        scope: RUN_TIME
        value: "0"
      - key: DEMO_MAX_INFLIGHT
        scope: RUN_TIME
        value: "0"
      - key: DEMO_PG_POOL_MAX
        scope: RUN_TIME
        value: "5"
